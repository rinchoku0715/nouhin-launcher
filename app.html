<style>
  :root{--bg:#e8934a;--card:#fbf6ef;--ink:#5c3a22;--ink-soft:#8a6a4c;--accent:#c9702f}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#3a2712;--card:#241a10;--ink:#f3e6d6;--ink-soft:#c9a986;--accent:#e8934a}
  }
  :root[data-theme="dark"]{--bg:#3a2712;--card:#241a10;--ink:#f3e6d6;--ink-soft:#c9a986;--accent:#e8934a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
  #appFrame{
    position:fixed;inset:0;width:100%;height:100vh;height:100dvh;
    border:none;display:block;background:var(--bg);
  }
  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);padding:24px;transition:opacity .25s ease;
  }
  #loading.hide{opacity:0;pointer-events:none}
  .card{
    background:var(--card);border-radius:28px;padding:40px 32px;max-width:320px;width:100%;
    text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.18);
  }
  .mark{
    width:84px;height:84px;border-radius:22px;margin:0 auto 20px;
    background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--card);line-height:1.25;letter-spacing:.02em;
  }
  h1{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--ink)}
  p{margin:0 0 24px;font-size:13px;color:var(--ink-soft)}
  .spinner{
    width:22px;height:22px;margin:0 auto 20px;border-radius:50%;
    border:3px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color:var(--accent);animation:spin .8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none} }
  @keyframes spin{to{transform:rotate(360deg)}}
  a.open{
    display:inline-block;width:100%;padding:13px 18px;border-radius:12px;
    background:var(--accent);color:#fff;font-weight:700;font-size:14px;text-decoration:none;
  }
</style>
</head>
<body>

<iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbyTnbWRFSx17HDczAzchackRgQ8lVUgTqjpi_NJFHk57yQGBSpT17x01O4NobmXIaXMaw/exec" title="納品書トラッカー"></iframe>

<div id="loading">
  <div class="card">
    <div class="mark">上々<br>納品書</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>上々　納品書</h1>
    <p>アプリを開いています…</p>
    <a class="open" id="openLink" href="https://script.google.com/macros/s/AKfycbyTnbWRFSx17HDczAzchackRgQ8lVUgTqjpi_NJFHk57yQGBSpT17x01O4NobmXIaXMaw/exec" target="_top">開かない場合はこちら</a>
  </div>
</div>

<script>
  var frame = document.getElementById('appFrame');
  var loading = document.getElementById('loading');
  var done = false;
  function reveal(){
    if (done) return;
    done = true;
    loading.classList.add('hide');
    setTimeout(function(){ loading.style.display = 'none'; }, 300);
  }
  frame.addEventListener('load', reveal);
  setTimeout(function(){ if (!done) reveal(); }, 6000);
</script>
</body>
